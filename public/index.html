<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef3fb">
<meta name="description" content="LeadClean merges your CSV/Excel lead files and pulls out clean, unique mobile numbers — entirely in your browser.">
<title>LeadClean — merge leads, extract numbers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%233f6fd1'/%3E%3Cpath d='M11 20a9 9 0 1 1 18 0 9 9 0 0 1-18 0Z' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M20 15v5l3.2 3.2' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="./utils.js"></script>
<style>
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.login-card{width:min(400px,100%);background:var(--panel);border-radius:16px;padding:32px;box-shadow:0 12px 36px #13203018}
.login-card .welcome-eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.login-card h1{font-size:30px;line-height:1.1;margin-bottom:8px}
.login-card>p{color:var(--muted);font-size:13px;margin-bottom:22px}
.login-card .field{margin-top:12px}
.login-card .text-input{height:48px}
.login-options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:12.5px}
.remember-option{display:flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer}
.remember-option input{width:16px;height:16px;accent-color:var(--accent)}
.forgot-link{color:var(--accent);font-weight:700;background:none;padding:0}
.login-error{color:var(--bad);font-size:12px;font-weight:700;margin:10px 0}
.login-card form .cta-btn{margin-top:20px;height:48px}
.login-privacy{text-align:center;margin:22px 0 0!important;font-size:11.5px!important;line-height:1.5}
/* Layout idea: sticky pill nav + hero, below it a two-column dashboard —
   a left column of always-visible wizard panels (upload, validate, configure,
   process) and a right column that stays in view with live stats, the
   progress ring and the primary action, so it is never scrolled out of
   reach (the one thing the old desktop app kept getting wrong). */
:root{
  --bg:#eef3fb;
  --panel:#ffffff;
  --ink:#131b2c;
  --muted:#667085;
  --line:#e2e8f3;
  --accent:#3f6fd1;
  --accent-ink:#ffffff;
  --accent-soft:#e8eefb;
  --good:#2f8f5b;
  --good-soft:#e7f5ec;
  --warn:#b9762a;
  --warn-soft:#fbf0e1;
  --bad:#c0433f;
  --bad-soft:#fbeceb;
  --font-display:'Instrument Serif', Georgia, serif;
  --font-body:'Inter Tight', Inter, Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0c0e14;
  --panel:#11141c;
  --ink:#eef1ee;
  --muted:#8a9289;
  --line:#262b28;
  --accent:#35d07f;
  --accent-ink:#0b150f;
  --accent-soft:#16251c;
  --good:#6fe3a8;
  --good-soft:#15271d;
  --warn:#e3b35c;
  --warn-soft:#2a2316;
  --bad:#ff8a8a;
  --bad-soft:#2a1818;
  color-scheme: dark;
}
:root[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
:root[data-theme="dark"] select,
:root[data-theme="dark"] .text-input,
:root[data-theme="dark"] .column-check-row{background:#161a15;border-color:var(--line);color:var(--ink)}
:root[data-theme="dark"] .log-box{background:#070a10;color:#9fb0ca}
body{transition:background-color .2s ease,color .2s ease}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
::selection{background:var(--accent-soft)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 64px}

/* --- nav --- */
.nav-row{display:flex;justify-content:center;padding-top:18px}
.nav{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:0 2px 14px #13203014;max-width:calc(100% - 32px)}
.wordmark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.3px;padding-right:10px}
.brand-mark{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#4d78dc;flex-shrink:0}
.brand-mark i{position:absolute;width:20px;height:20px;border:2.2px solid #fff;border-radius:50%;transform:rotate(-28deg)}
.brand-mark i:last-child{width:12px;height:12px;transform:translate(4px,3px) rotate(-28deg)}
.brand-name{font-family:var(--font-display);font-size:38px;font-weight:400;line-height:1;color:var(--ink)}
.login-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 24px}
.login-brand .brand-mark{width:48px;height:48px;border-radius:14px}
.login-brand .brand-mark i{width:25px;height:25px}
.login-brand .brand-mark i:last-child{width:15px;height:15px}
.nav-links{display:flex;align-items:center;gap:3px}
.nav-link{font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-radius:999px}
.nav-link:hover{background:var(--accent-soft);color:var(--ink)}
.nav-cta{font-size:12px;font-weight:600;background:var(--ink);color:#fff;padding:9px 15px;border-radius:999px;margin-left:4px}
.nav-cta:hover{background:#2a3246}
.nav-actions{display:flex;align-items:center;gap:6px}
.theme-toggle-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);font-size:15px;margin-left:2px;transition:background .15s}
.theme-toggle-btn:hover{background:var(--line)}

/* --- manage team modal --- */
.team-overlay{position:fixed;inset:0;background:rgba(6,8,12,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.team-card{position:relative;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;background:var(--panel);border-radius:16px;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.team-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.team-card-head h2{font-size:17px;font-weight:700}
.team-close-btn{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);font-size:13px}
.team-close-btn:hover{background:var(--line)}
.team-card-sub{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 16px}
.team-error{background:var(--bad-soft);color:var(--bad);font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:12px}
.team-add-row{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.team-list{display:flex;flex-direction:column;gap:6px}
.team-list-empty{font-size:12.5px;color:var(--muted);padding:8px 0}
.team-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.team-row-mobile{font-weight:600;letter-spacing:.2px}
.team-row-badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:999px}
.team-row-remove{font-size:11.5px;font-weight:600;color:var(--bad);background:var(--bad-soft);padding:5px 10px;border-radius:999px}
.team-row-remove:hover{opacity:.8}

/* --- hero --- */
.hero{padding:40px 4px 8px;max-width:720px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:var(--font-body);font-size:clamp(30px,4vw,42px);font-weight:700;letter-spacing:-1.2px;line-height:1.08;margin:12px 0 10px;text-wrap:balance}
.hero h1 em{font-family:var(--font-display);font-style:italic;font-weight:400;color:var(--accent)}
.hero p{font-size:15px;color:var(--muted);max-width:52ch}
.privacy-chip{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:7px 13px;border-radius:999px;background:var(--good-soft);color:var(--good);font-size:12px;font-weight:600}
.privacy-chip i{width:6px;height:6px;border-radius:50%;background:var(--good)}

/* --- dashboard grid --- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;margin-top:28px}
.col-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.col-side{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}

.panel{background:var(--panel);border-radius:20px;padding:22px 24px;box-shadow:0 2px 16px #13203010}
.panel[data-locked="true"]{opacity:.5}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-head h2{font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.step-badge{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;flex-shrink:0}
.step-badge[data-done="true"]{background:var(--good);color:#fff}
.panel-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* dropzone */
.dropzone{border:1.5px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;transition:border-color .15s,background .15s}
.dropzone[data-active="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dropzone p{font-size:13px;color:var(--muted)}
.dropzone strong{color:var(--ink)}
.browse-btn{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600}
.browse-btn:hover{background:#3561bb}

.file-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.file-row:first-of-type{border-top:0;margin-top:14px}
.file-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);flex-shrink:0;font-size:11px;font-weight:700}
.file-meta{flex:1;min-width:0}
.file-meta .name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta .sub{font-size:11px;color:var(--muted)}
.file-progress{display:grid;grid-template-columns:max-content minmax(90px,180px);align-items:center;gap:9px;margin-top:7px;font-size:12px;font-weight:800;color:var(--accent)}
.file-progress[data-reading="true"]{color:var(--warn)}
.file-progress-bar{height:7px;flex:1;width:180px;border-radius:999px;background:var(--line);overflow:hidden}
.file-progress-bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .12s}
.file-remove{font-size:11px;font-weight:600;color:var(--bad);padding:5px 9px;border-radius:7px}
.file-remove:hover{background:var(--bad-soft)}

/* validation */
.status-line{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px}
.status-line i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-good i{background:var(--good)}
.status-good{color:var(--good)}
.status-warn i{background:var(--warn)}
.status-warn{color:var(--warn)}
.problem-card{margin-top:12px;border:1px solid var(--warn-soft);background:var(--warn-soft);border-radius:12px;padding:12px 14px}
.problem-card h3{font-size:12.5px;font-weight:700;color:var(--warn)}
.problem-card .cols{font-size:11.5px;color:#7a5620;margin:6px 0;line-height:1.6;word-break:break-word}
.problem-card .sheets{font-size:12px;color:var(--ink)}
.problem-card label{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:8px;font-weight:600}

/* form controls */
.field{margin-top:14px}
.field:first-child{margin-top:0}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px}
.field .hint{font-size:11px;color:var(--muted);margin-top:5px}
select,.text-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.chip-radio{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip-radio[data-active="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.split-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.split-row input[type="number"]{width:100px}
.split-preview{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#f7f9fd}
.split-preview h3{font-size:12.5px;margin-bottom:8px}
.split-preview-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.split-preview-item{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:8px;background:#fff;font-size:11.5px}
.split-preview-item strong{color:var(--accent);white-space:nowrap}
@media(max-width:520px){.split-preview-list{grid-template-columns:1fr}}

.column-check-list{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto;margin-top:10px;padding-right:4px}
.column-check-row{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff}
.column-check-row[data-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.column-check-name{flex:1;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.column-check-count{font-size:11px;color:var(--muted);white-space:nowrap}
.column-check-select{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:7px}
.col-picker{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto;margin-top:10px;padding-right:4px}
.col-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;background:#f7f9fd}
.col-item input[type="checkbox"]{width:15px;height:15px;accent-color:var(--accent)}
.col-item .cname{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-item .ccount{font-size:10.5px;color:var(--muted)}
.col-item .reorder{display:flex;gap:2px}
.col-item .reorder button{width:20px;height:20px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:10px;display:grid;place-items:center}
.picker-tools{display:flex;gap:8px;margin-top:8px}
.picker-tools button{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:8px}

/* side column: stats + ring + cta */
.ring-wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:148px;height:148px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--pct,0%), var(--line) var(--pct,0%));transition:background .25s}
.ring::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.ring-label{position:relative;font-size:27px;font-weight:700;letter-spacing:-1px}
.ring-label small{font-size:14px;font-weight:600;color:var(--muted)}
.ring-phase{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat-tile{background:#f7f9fd;border-radius:12px;padding:12px 13px}
.stat-tile .num{font-size:21px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat-tile .lbl{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}

.cta-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700}
.cta-btn:hover:not(:disabled){background:#3561bb}

.log-box{background:#10172a;color:#aab6d6;border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.7;max-height:150px;overflow-y:auto}
.log-box .line-err{color:#ff9d93}
.log-box .line-ok{color:#8fd6ac}

.output-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.output-row:first-of-type{border-top:0}
.output-row .meta{flex:1;min-width:0}
.output-row .meta .name{font-size:13px;font-weight:600}
.output-row .meta .sub{font-size:11px;color:var(--muted)}
.dl-btn{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:7px 12px;border-radius:8px;white-space:nowrap}
.dl-btn:hover{background:#dbe6fa}
.dl-btn[data-done="true"]{background:var(--good-soft);color:var(--good)}

.footnote{overflow:hidden;width:100%;margin-top:30px;padding:12px 0;font-size:20px;font-weight:800;letter-spacing:0}
.creator-credit{display:inline-block;white-space:nowrap;background:linear-gradient(90deg,#2563eb,#ea580c,#16a34a,#7c3aed);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:creator-scroll 10s linear infinite alternate,creator-color 4s linear infinite}
@keyframes creator-scroll{from{transform:translateX(-18%)}to{transform:translateX(18%)}}
@keyframes creator-color{from{background-position:0 50%}to{background-position:200% 50%}}

@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  .col-side{position:static}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---- Pull-cord lamp login ---- */
.login-page.lamp-mode{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6vw;background:#0c0e14;position:relative;overflow:hidden}
.login-page.lamp-mode .lamp-ambient{position:absolute;inset:0;background:radial-gradient(circle at 32% 55%,rgba(53,208,127,0) 0%,rgba(53,208,127,0) 60%,transparent 70%);transition:background .6s ease;pointer-events:none}
.login-page.lamp-mode.lamp-on .lamp-ambient{background:radial-gradient(circle at 32% 58%,rgba(53,208,127,.16) 0%,rgba(53,208,127,.06) 35%,transparent 70%)}
.lamp-wrap{position:relative;width:min(28vw,280px);display:flex;flex-direction:column;align-items:center;user-select:none;flex-shrink:0}
.lamp-light-cone{position:absolute;top:100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(53,208,127,.55) 0%,rgba(53,208,127,.18) 40%,transparent 70%);opacity:0;transform:scale(.6);transition:opacity .5s ease,transform .6s ease;filter:blur(2px);pointer-events:none}
.lamp-mode.lamp-on .lamp-light-cone{opacity:1;transform:scale(1)}
.lamp-shade{position:relative;width:160px;height:106px;clip-path:polygon(30% 0%,70% 0%,100% 100%,0% 100%);background:linear-gradient(180deg,#3b3d46,#2a2c33);transition:background .5s ease;z-index:2}
.lamp-mode.lamp-on .lamp-shade{background:linear-gradient(180deg,#3f8f66,#276b49)}
.lamp-shade-top{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:54%;height:14px;border-radius:6px 6px 0 0;background:#2a2c33;transition:background .5s ease;z-index:3}
.lamp-mode.lamp-on .lamp-shade-top{background:#1f5c3e}
.lamp-face{position:absolute;top:50px;left:50%;transform:translateX(-50%);width:100px;height:46px;display:flex;flex-direction:column;align-items:center;z-index:4}
.lamp-eyes{display:flex;gap:24px}
.lamp-eye{width:13px;height:13px;position:relative}
.lamp-eye::before{content:"";position:absolute;inset:0;border-radius:50%;background:#1c1d22;transform:scaleY(.15);transition:transform .35s ease}
.lamp-mode.lamp-on .lamp-eye::before{transform:scaleY(1)}

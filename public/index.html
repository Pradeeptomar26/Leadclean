<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useRef,useMemo,useCallback,useEffect} = React;
const U = window.LeadCleanUtils;

const MOBILE_HINTS = ['mobile','phone','contact','cell','msisdn','whatsapp','number'];
const KEY_HINTS = ['userid','user_id','id'];

function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}
function fmtNum(n){ return (n||0).toLocaleString('en-IN'); }
function csvEscape(v){
  const s = v === null || v === undefined ? '' : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function guessColumn(names, hints){
  const lower = names.map(n => n.toLowerCase());
  for(const h of hints){
    const i = lower.findIndex(n => n.includes(h));
    if(i >= 0) return names[i];
  }
  return names[0] || null;
}

// Reads one file in a Web Worker so parsing a large CSV or workbook cannot
// lock the page and trigger Chrome's "Page Unresponsive" dialog.
async function parseFile(file, onProgress, onBatch){
  const ext = file.name.toLowerCase().split('.').pop();
  const readData = await new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onprogress = event => {
      if(event.lengthComputable) onProgress?.(Math.min(95, Math.round((event.loaded/event.total)*95)));
    };
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('Could not read file'));
    if(ext === 'csv' || ext === 'txt') reader.readAsText(file);
    else reader.readAsArrayBuffer(file);
  });
  const utilsUrl = new URL('./utils.js', window.location.href).href + '?v=' + Date.now();
  const xlsxUrl = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
  const workerSource = `
    importScripts(${JSON.stringify(utilsUrl)});
    if (${JSON.stringify(ext !== 'csv' && ext !== 'txt')}) {
      importScripts(${JSON.stringify(xlsxUrl)});
    }
    self.onmessage = async function(event) {
      try {
        const ext = event.data.ext;
        const readData = event.data.readData;
        const fileName = event.data.fileName;
        const tables = [];
        if(ext === 'csv' || ext === 'txt'){
          const text = typeof readData === 'string' ? readData : new TextDecoder().decode(readData);
          var parsed = LeadCleanUtils.parseCsv(text);
          var rows = parsed.rows;
          if(parsed.header.length <= 1 && rows.length){
            var headerRow = parsed.header;
            var hintPattern = /mobile|phone|contact|cell|msisdn|whatsapp|number/i;
            var sourceRows = rows.slice(0,100);
            var best=-1,bestIdx=0,bestFilled=0;
            sourceRows.forEach(function(row,idx){
              var filled=row.filter(function(v){return String(v||'').trim()!==''}).length;
              var hints=row.filter(function(v){return hintPattern.test(String(v||''))}).length;
              var score=hints*10+filled;
              if(score>best){best=score;bestIdx=idx;bestFilled=filled;}
            });
            if(best>=10 && sourceRows[bestIdx]){
              parsed.header=sourceRows[bestIdx].map(function(v){return String(v||'').trim();});
              rows=rows.slice(bestIdx+1);
            }
          }
          self.postMessage({type:'sheet', sheetIndex:0, label:fileName, header:parsed.header});
          for(let i=0;i<rows.length;i+=5000){
            self.postMessage({type:'rows', sheetIndex:0, rows:rows.slice(i,i+5000)});
          }
          self.postMessage({type:'complete'});
        }else{
          const buf = readData;
          const wb = XLSX.read(buf, {type:'array', dense:true, cellFormula:false, cellHTML:false, cellStyles:false, sheetRows:0});
          wb.SheetNames.forEach(function(name, sheetIndex){
            self.postMessage({ok:false, progress:true, fileName:fileName, phase:'Analyzing sheet', percent:95 + Math.round(((sheetIndex+1)/wb.SheetNames.length)*4)});
            const ws = wb.Sheets[name];
            const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
            const maxRows = range.e.r - range.s.r + 1;
            const maxCols = range.e.c - range.s.c + 1;
            let grid;
            if(ws['!data']){
              grid = ws['!data'];
            }else if(Array.isArray(ws[range.s.r])){
              // With dense:true, this SheetJS build stores each row as a
              // numeric-indexed array property directly on the worksheet
              // object (ws[0], ws[1], ...) rather than under ws['!data'].
              // Read that format directly instead of falling through to
              // sparse cell addressing, which returns undefined here and
              // was silently producing an all-blank grid.
              grid = new Array(maxRows);
              for(let r=0;r<maxRows;r++){
                grid[r] = ws[r+range.s.r] || [];
              }
            }else{
              grid = new Array(maxRows);
              for(let r=0;r<maxRows;r++){
                const outRow = new Array(maxCols);
                for(let c=0;c<maxCols;c++){
                  const cell = ws[XLSX.utils.encode_cell({r:r+range.s.r,c:c+range.s.c})];
                  outRow[c] = cell ? (cell.w !== undefined ? cell.w : (cell.v !== undefined ? String(cell.v) : '')) : '';
                }
                grid[r] = outRow;
              }
            }
            if(!grid.length) return;
            let headerRowIdx = 0;
            const scanLimit = Math.min(grid.length, 100);
            let bestHeaderScore = -1;
            const hintNames = /mobile|phone|contact|cell|msisdn|whatsapp|number|lead|data|name|userid|customer|id/i;
            for(let r=0;r<scanLimit;r++){
              const row = grid[r] || [];
              let filled = 0;
              let hintScore = 0;
              for(const h of row){
                let v = h && h.w !== undefined ? h.w : (h && h.v !== undefined ? h.v : h);
                v = String(v == null ? '' : v).trim();
                if(v){ filled++; if(hintNames.test(v)) hintScore += 3; }
              }
              const score = hintScore*10+filled;
              if(score>bestHeaderScore){bestHeaderScore=score;headerRowIdx=r;}
            }
            const header = (grid[headerRowIdx] || []).map(function(h){
              if(h && h.w !== undefined) return String(h.w).trim();
              if(h && h.v !== undefined) return String(h.v).trim();
              return String(h == null ? '' : h).trim();
            });
            const label = wb.SheetNames.length > 1 ? (fileName + ' › ' + name) : fileName;
            self.postMessage({type:'sheet', sheetIndex:sheetIndex, label:label, header:header});
            for(let i=headerRowIdx+1;i<grid.length;i+=5000){
              const batch = grid.slice(i,i+5000).map(function(row){
                return row.map(function(cell){
                  if(cell && cell.w !== undefined) return cell.w;
                  if(cell && cell.v !== undefined) return String(cell.v);
                  return cell == null ? '' : String(cell);
                });
              });
              self.postMessage({type:'rows', sheetIndex:sheetIndex, rows:batch});
            }
          });
        }
        if(ext !== 'csv' && ext !== 'txt') self.postMessage({type:'complete'});
      }catch(error){
        self.postMessage({ok:false, error:error && error.message ? error.message : String(error)});
      }
    };
  `;

  const blob = new Blob([workerSource], {type:'text/javascript'});
  const workerUrl = URL.createObjectURL(blob);
  const worker = new Worker(workerUrl);

  return await new Promise((resolve,reject)=>{
    worker.onmessage = event => {
      if(event.data.type === 'sheet' || event.data.type === 'rows'){
        onBatch?.(event.data);
        return;
      }
      if(event.data.type === 'complete'){
        worker.terminate();
        URL.revokeObjectURL(workerUrl);
        onProgress?.(100);
        resolve(true);
        return;
      }
      if(event.data.progress && event.data.phase){
        if(Number.isFinite(event.data.percent)) onProgress?.(event.data.percent);
        return;
      }
      worker.terminate();
      URL.revokeObjectURL(workerUrl);
      if(event.data.ok){
        onProgress?.(100);
        resolve(event.data.tables);
      }
      else reject(new Error(event.data.error));
    };
    worker.onerror = event => {
      worker.terminate();
      URL.revokeObjectURL(workerUrl);
      reject(new Error(event.message || 'Could not read that file'));
    };
    const transferable = readData instanceof ArrayBuffer ? [readData] : [];
    worker.postMessage({readData, ext, fileName:file.name}, transferable);
  });
}

function Brand({wordmark=true, login=false}){
  return (
    <span className={login ? 'login-brand' : 'wordmark'}>
      <span className="brand-mark" aria-label="LeadClean logo"><i></i><i></i></span>
      {wordmark && <span className={login ? 'brand-name' : 'brand-name'} style={login ? undefined : {fontSize:'28px'}}>LeadClean</span>}
    </span>
  );
}

function StepBadge({n, done}){
  return <span className="step-badge" data-done={done}>{done ? '✓' : n}</span>;
}

function Dropzone({onFiles, accept, placeholder}){
  const [active,setActive] = useState(false);
  const inputRef = useRef(null);
  return (
    <div className="dropzone" data-active={active}
      onDragOver={e=>{e.preventDefault();setActive(true);}}
      onDragLeave={()=>setActive(false)}
      onDrop={e=>{e.preventDefault();setActive(false);onFiles(Array.from(e.dataTransfer.files));}}>
      <p><strong>Drag files here</strong> or browse from your computer.</p>
      <p>{placeholder}</p>
      <button type="button" className="browse-btn" onClick={()=>inputRef.current.click()}>Choose files ↗</button>
      <input ref={inputRef} type="file" multiple accept={accept} style={{display:'none'}}
        onChange={e=>{onFiles(Array.from(e.target.files)); e.target.value='';}} />
    </div>
  );
}

function App(){
  const [files, setFiles] = useState([]);
  const [tables, setTables] = useState([]);
  const [parsing, setParsing] = useState(false);
  const [parseError, setParseError] = useState('');
  const [fileReadProgress, setFileReadProgress] = useState({});
  const [fileReadRows, setFileReadRows] = useState({});
  const rowsRef = useRef(new Map());
  const mobileColumnsRef = useRef([]);
  const liveSheetHeadersRef = useRef(new Map());
  const liveMobileSeenRef = useRef(new Set());
  const liveMobileTotalRef = useRef(0);

  const [mode, setMode] = useState('unique');
  const [mobileMode, setMobileMode] = useState('direct');
  const [mobileColumns, setMobileColumns] = useState([]);
  const [skippedShapes, setSkippedShapes] = useState({});

  const [lookupFiles, setLookupFiles] = useState([]);
  const [lookupTables, setLookupTables] = useState([]);
  const lookupRowsRef = useRef(new Map());
  const [lookupMainKey, setLookupMainKey] = useState('');
  const [lookupKey, setLookupKey] = useState('');
  const [lookupValue, setLookupValue] = useState('');

  const [selectedColumns, setSelectedColumns] = useState([]);
  const [extraUniqueColumns, setExtraUniqueColumns] = useState([]);
  const [splitMode, setSplitMode] = useState('none');
  const [splitValue, setSplitValue] = useState('');
  const [outputNames, setOutputNames] = useState([]);

  const [proc, setProc] = useState({running:false, pct:0, phase:'', scanned:0, total:0});
  const [uploadStats, setUploadStats] = useState({totalMobile:0, uniqueCount:0, ready:false});
  const [log, setLog] = useState([]);
  const [result, setResult] = useState(null);
  const [zipping, setZipping] = useState(false);
  const [customFileNames, setCustomFileNames] = useState({});
  const [editingOutputIdx, setEditingOutputIdx] = useState(null);
  const [downloadsCap, setDownloadsCap] = useState(undefined);
  const [authenticated, setAuthenticated] = useState(()=>sessionStorage.getItem('leadclean_authenticated') === 'true' || localStorage.getItem('leadclean_authenticated') === 'true');
  const [loginMobile, setLoginMobile] = useState('');
  const [loginPassword, setLoginPassword] = useState('');
  const [loginError, setLoginError] = useState('');
  const [rememberMe, setRememberMe] = useState(()=>localStorage.getItem('leadclean_remember_me') === 'true');
  const [failedAttempts, setFailedAttempts] = useState(()=>Number(sessionStorage.getItem('leadclean_failed_attempts') || 0));
  const [lockUntil, setLockUntil] = useState(()=>Number(sessionStorage.getItem('leadclean_lock_until') || 0));
  const [lockSeconds, setLockSeconds] = useState(()=>Math.max(0, Math.ceil((Number(sessionStorage.getItem('leadclean_lock_until') || 0)-Date.now())/1000)));
  const [lampOn, setLampOn] = useState(false);
  const [cordPulsing, setCordPulsing] = useState(false);
  const [loginBusy, setLoginBusy] = useState(false);
  const [forgotOpen, setForgotOpen] = useState(false);
  const [forgotStep, setForgotStep] = useState('email'); // 'email' | 'otp' | 'reset' | 'done'
  const [forgotEmail, setForgotEmail] = useState('');
  const [forgotCode, setForgotCode] = useState('');
  const [forgotNewPassword, setForgotNewPassword] = useState('');
  const [forgotConfirmPassword, setForgotConfirmPassword] = useState('');
  const [forgotError, setForgotError] = useState('');
  const [forgotBusy, setForgotBusy] = useState(false);
  const [resetToken, setResetToken] = useState('');
  const [theme, setTheme] = useState(()=>localStorage.getItem('leadclean_theme') || 'light');
  useEffect(()=>{
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('leadclean_theme', theme);
  }, [theme]);
  function toggleTheme(){
    setTheme(t => t === 'dark' ? 'light' : 'dark');
  }
  function getAuthToken(){
    return sessionStorage.getItem('leadclean_token') || localStorage.getItem('leadclean_token') || '';
  }
  const [teamOpen, setTeamOpen] = useState(false);
  const [teamUsers, setTeamUsers] = useState([]);
  const [teamLoading, setTeamLoading] = useState(false);
  const [teamError, setTeamError] = useState('');
  const [teamNewMobile, setTeamNewMobile] = useState('');
  const [teamNewPassword, setTeamNewPassword] = useState('');
  const [teamAddBusy, setTeamAddBusy] = useState(false);
  async function openTeamPanel(){
    setTeamOpen(true);
    setTeamError('');
    setTeamLoading(true);
    try{
      const res = await fetch('/api/team/list', {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + getAuthToken()}
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.ok){
        setTeamUsers(data.users || []);
      }else{
        setTeamError((data && data.error) || 'Could not load the team list.');
      }
    }catch(e){
      setTeamError('Could not reach the server. Check your connection and try again.');
    }
    setTeamLoading(false);
  }
  function closeTeamPanel(){
    setTeamOpen(false);
    setTeamError('');
    setTeamNewMobile('');
    setTeamNewPassword('');
  }
  async function addTeamUser(e){
    e.preventDefault();
    setTeamError('');
    const mobile = teamNewMobile.replace(/\D/g,'');
    if(mobile.length !== 10){ setTeamError('Enter a valid 10-digit mobile number.'); return; }
    if(teamNewPassword.length < 8){ setTeamError('Password must be at least 8 characters.'); return; }
    setTeamAddBusy(true);
    try{
      const res = await fetch('/api/team/add', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + getAuthToken()},
        body: JSON.stringify({ mobile, password: teamNewPassword })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.ok){
        setTeamNewMobile('');
        setTeamNewPassword('');
        await openTeamPanel();
      }else{
        setTeamError((data && data.error) || 'Could not add this teammate.');
      }
    }catch(e){
      setTeamError('Could not reach the server. Check your connection and try again.');
    }
    setTeamAddBusy(false);
  }
  async function removeTeamUser(mobile){
    setTeamError('');
    try{
      const res = await fetch('/api/team/remove', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + getAuthToken()},
        body: JSON.stringify({ mobile })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.ok){
        setTeamUsers(prev => prev.filter(u => u.mobile !== mobile));
      }else{
        setTeamError((data && data.error) || 'Could not remove this teammate.');
      }
    }catch(e){
      setTeamError('Could not reach the server. Check your connection and try again.');
    }
  }
  function pullCord(){
    setCordPulsing(true);
    setLampOn(v=>!v);
    setTimeout(()=>setCordPulsing(false), 450);
  }

  // Two separate hosts run this same file: the Claude-hosted preview (where
  // window.claude exists and downloads must go through its "downloads"
  // capability, since a plain <a download> is refused in that sandboxed
  // frame) and a normal site such as Cloudflare Pages (no window.claude at
  // all, where a plain <a download> works exactly as on any other website).
  const inArtifactHost = typeof window.claude !== 'undefined';
  useEffect(()=>{
    let done = false;
    (async()=>{
      try{
        if(inArtifactHost && window.claude.use){
          const d = await window.claude.use('downloads');
          if(!done) setDownloadsCap(d);
        } else if(!done) setDownloadsCap(null);
      }catch(e){ if(!done) setDownloadsCap(null); }
    })();
    return ()=>{done=true;};
  },[]);

  function pushLog(line, kind){
    setLog(l => [...l.slice(-60), {text:line, kind}]);
  }

  function rescanMobileCounts(){
    if(mobileMode !== 'direct' || tables.length === 0){ return; }
    const cols = mobileColumnsRef.current;
    if(!cols.length){ setUploadStats({totalMobile:0,uniqueCount:0,ready:true}); return; }

    let total = 0;
    const seen = new Set();
    liveSheetHeadersRef.current.forEach((header,tableId)=>{
      const idxs = cols.map(name=>header.indexOf(name)).filter(i=>i>=0);
      if(!idxs.length) return;
      const rows = rowsRef.current.get(tableId)||[];
      for(const row of rows){
        for(const idx of idxs){
          const clean = U.normalizeMobile(row[idx]);
          if(clean){ total++; seen.add(clean); }
        }
      }
    });
    setUploadStats({totalMobile:total, uniqueCount:seen.size, ready:true});
  }

  const addFiles = useCallback(async (list)=>{
    const accepted = list.filter(f => /\.(csv|txt|xlsx|xls)$/i.test(f.name));
    if(!accepted.length) return;
    setParsing(true); setParseError('');
    const newFileMetas = accepted.map(f => ({id: f.name+'_'+f.size+'_'+Date.now()+Math.random(), name:f.name, size:f.size}));
    setFiles(fs => [...fs, ...newFileMetas]);
    liveMobileSeenRef.current = new Set();
    liveMobileTotalRef.current = 0;
    setUploadStats({totalMobile:0, uniqueCount:0, ready:false});
    try{
      for(let i=0;i<accepted.length;i++){
        setFileReadProgress(p=>({...p,[newFileMetas[i].id]:0}));
        const fileId = newFileMetas[i].id;
        let parsedRowCount = 0;
        await parseFile(accepted[i], pct=>setFileReadProgress(p=>({...p,[fileId]:pct})), batch=>{
          if(batch.type === 'sheet'){
            const id = fileId+'__'+batch.sheetIndex;
            liveSheetHeadersRef.current.set(id, batch.header);
            if(!mobileColumnsRef.current.length){
              const guessed = guessColumn(batch.header, MOBILE_HINTS);
              if(guessed){ mobileColumnsRef.current = [guessed]; setMobileColumns([guessed]); }
            }
            rowsRef.current.set(id, []);
            setTables(ts=>[...ts, {id, fileId, label:batch.label, header:batch.header, rowCount:0}]);
          }else if(batch.type === 'rows'){
            const id = fileId+'__'+batch.sheetIndex;
            parsedRowCount += batch.rows.length;
            if(mobileMode === 'direct'){
              const header = liveSheetHeadersRef.current.get(id) || [];
              const mobileIdxs = mobileColumnsRef.current.map(name=>header.indexOf(name)).filter(i=>i>=0);
              if(mobileIdxs.length){
                batch.rows.forEach(row=>{
                  for(const mobileIdx of mobileIdxs){
                    const clean = U.normalizeMobile(row[mobileIdx]);
                    if(clean){
                      liveMobileTotalRef.current++;
                      liveMobileSeenRef.current.add(clean);
                    }
                  }
                });
                setUploadStats({
                  totalMobile:liveMobileTotalRef.current,
                  uniqueCount:liveMobileSeenRef.current.size,
                  ready:true,
                });
              }
            }
            rowsRef.current.set(id, [...(rowsRef.current.get(id)||[]), ...batch.rows]);
            setFileReadRows(p=>({...p,[fileId]:parsedRowCount}));
            setTables(ts=>ts.map(t=>t.id===id ? {...t,rowCount:t.rowCount+batch.rows.length} : t));
          }
        });
        pushLog('Parsed ' + accepted[i].name, 'ok');
        rescanMobileCounts();
      }
    }catch(err){
      setParseError('Could not read that file — ' + (err.message || err));
      pushLog('Parse error: '+(err.message||err), 'err');
    }finally{
      setParsing(false);
    }
  }, []);

  const removeFile = useCallback((fileId)=>{
    setFiles(fs => fs.filter(f=>f.id!==fileId));
    setFileReadProgress(p=>{const next={...p};delete next[fileId];return next;});
    setFileReadRows(p=>{const next={...p};delete next[fileId];return next;});
    setTables(ts => {
      const keep = ts.filter(t=>t.fileId!==fileId);
      ts.filter(t=>t.fileId===fileId).forEach(t=>rowsRef.current.delete(t.id));
      return keep;
    });
  }, []);

  const addLookupFiles = useCallback(async (list)=>{
    const accepted = list.filter(f => /\.(csv|txt|xlsx|xls)$/i.test(f.name));
    if(!accepted.length) return;
    const metas = accepted.map(f => ({id:f.name+'_'+f.size+'_'+Date.now()+Math.random(), name:f.name, size:f.size}));
    setLookupFiles(fs=>[...fs, ...metas]);
    for(let i=0;i<accepted.length;i++){
      setFileReadProgress(p=>({...p,[metas[i].id]:0}));
      const fileId = metas[i].id;
      let parsedRowCount = 0;
      await parseFile(accepted[i], pct=>setFileReadProgress(p=>({...p,[fileId]:pct})), batch=>{
        if(batch.type === 'sheet'){
          const id = fileId+'__'+batch.sheetIndex;
          lookupRowsRef.current.set(id, []);
          setLookupTables(ts=>[...ts, {id, fileId, label:batch.label, header:batch.header, rowCount:0}]);
        }else if(batch.type === 'rows'){
          const id = fileId+'__'+batch.sheetIndex;
          parsedRowCount += batch.rows.length;
          lookupRowsRef.current.set(id,[...(lookupRowsRef.current.get(id)||[]),...batch.rows]);
          setFileReadRows(p=>({...p,[fileId]:parsedRowCount}));
          setLookupTables(ts=>ts.map(t=>t.id===id ? {...t,rowCount:t.rowCount+batch.rows.length} : t));
        }
      });
    }
  }, []);

  const dominant = useMemo(()=> tables.length ? U.dominantShape(tables) : null, [tables]);
  const problemGroups = useMemo(()=> tables.length && dominant ? U.groupHeaderProblems(tables, dominant) : [], [tables, dominant]);
  const unionColumns = useMemo(()=> U.columnUnion(tables), [tables]);
  const lookupUnion = useMemo(()=> U.columnUnion(lookupTables), [lookupTables]);
  const totalRowsParsed = useMemo(()=> tables.reduce((a,t)=>a+t.rowCount,0), [tables]);

  // How many valid phone numbers each currently-selected "mobile number
  // column" actually contains — lets the UI flag a column picked there by
  // mistake (e.g. PAN) instead of it silently contributing nothing.
  const mobileColumnValidCount = useMemo(()=>{
    if(mobileMode !== 'direct' || !mobileColumns.length || !tables.length) return {};
    const counts = {};
    mobileColumns.forEach(name=>{
      let count = 0;
      for(const table of tables){
        const idx = table.header.indexOf(name);
        if(idx < 0) continue;
        const rows = rowsRef.current.get(table.id)||[];
        for(const row of rows){ if(U.normalizeMobile(row[idx])) count++; }
      }
      counts[name] = count;
    });
    return counts;
  }, [tables, mobileColumns, mobileMode]);

  const includedTables = useMemo(()=>{
    return tables.filter(t=>{
      const shape = U.headerShape(t.header);
      if(shape === dominant) return true;
      return !!skippedShapes[shape];
    });
  }, [tables, dominant, skippedShapes]);

  useEffect(()=>{mobileColumnsRef.current = mobileColumns;}, [mobileColumns]);

  useEffect(()=>{
    if(unionColumns.length){
      setMobileColumns(cols=>{
        if(cols.length) return cols;
        const guess = guessColumn(unionColumns.map(c=>c.name), MOBILE_HINTS);
        return guess ? [guess] : cols;
      });
    }
  }, [unionColumns]);

  useEffect(()=>{
    let cancelled = false;

    // Recomputes stats from whichever column(s) are currently selected in
    // "Check the columns" — it never picks a different column on its own.
    // The old version re-scored every column on each run and silently
    // overwrote the user's choice with whatever looked most mobile-like,
    // which is why selecting anything other than "Mobile" snapped straight
    // back to it.
    async function previewStats(){
      if(mobileMode !== 'direct' || tables.length === 0 || mobileColumns.length === 0){
        if(!cancelled) setUploadStats({totalMobile:0, uniqueCount:0, ready:true});
        return;
      }

      let totalMobile = 0;
      const seen = new Set();
      for(const table of tables){
        const idxs = mobileColumns.map(name=>table.header.indexOf(name)).filter(i=>i>=0);
        if(!idxs.length) continue;
        const rows = rowsRef.current.get(table.id)||[];
        for(const row of rows){
          for(const idx of idxs){
            const clean = U.normalizeMobile(row[idx]);
            if(clean){ totalMobile++; seen.add(clean); }
          }
        }
      }

      if(!cancelled) setUploadStats({totalMobile, uniqueCount:seen.size, ready:true});
    }

    previewStats();
    return ()=>{cancelled=true;};
  }, [tables, mobileMode, mobileColumns]);

  useEffect(()=>{
    if(selectedColumns.length === 0 && unionColumns.length){
      setSelectedColumns(unionColumns.map(c=>c.name));
    }
  }, [unionColumns, selectedColumns.length]);

  useEffect(()=>{
    if(lookupUnion.length){
      if(!lookupKey) setLookupKey(guessColumn(lookupUnion.map(c=>c.name), KEY_HINTS));
      if(!lookupValue) setLookupValue(guessColumn(lookupUnion.map(c=>c.name), MOBILE_HINTS));
    }
    if(unionColumns.length && !lookupMainKey){
      setLookupMainKey(guessColumn(unionColumns.map(c=>c.name), KEY_HINTS));
    }
  }, [lookupUnion, unionColumns]);

  const readyToProcess = includedTables.length > 0 &&
    (mobileMode === 'direct' ? mobileColumns.length>0 : (lookupMainKey && lookupKey && lookupValue && lookupTables.length>0)) &&
    !proc.running;

  const splitPartCount = splitMode === 'none'
    ? 1
    : splitMode === 'parts'
      ? Math.max(1, parseInt(splitValue||'1',10))
      : Math.max(1, Math.ceil((mode==='merge' ? totalRowsParsed : uploadStats.uniqueCount) / Math.max(1, parseInt(splitValue||'1',10))));

  const splitPreview = useMemo(()=>{
    if(splitMode === 'none') return [];
    const available = mode==='merge'
      ? (result ? result.totalRows : totalRowsParsed)
      : (result ? result.uniqueCount : uploadStats.uniqueCount);
    if(splitMode === 'rows'){
      const perFile = Math.max(1, parseInt(splitValue||'1',10));
      const parts = [];
      for(let start=0, index=1; start<available; start+=perFile, index++){
        parts.push({label:'Part '+index, count:Math.min(perFile, available-start)});
      }
      return available > 0 ? parts : [{label:'Part 1', count:0}];
    }
    const partsWanted = Math.max(1, parseInt(splitValue||'1',10));
    const perFile = U.rowsPerPart(available, partsWanted);
    const parts = [];
    for(let start=0, index=1; start<available; start+=perFile, index++){
      parts.push({label:'Part '+index, count:Math.min(perFile, available-start)});
    }
    if(parts.length === 0) parts.push({label:'Part 1', count:0});
    while(parts.length < partsWanted) parts.push({label:'Part '+(parts.length+1), count:0});
    return parts.slice(0, partsWanted);
  }, [splitMode, splitValue, mode, result, totalRowsParsed, uploadStats.uniqueCount]);

  function moveColumn(name, dir){
    setSelectedColumns(cols=>{
      const i = cols.indexOf(name);
      const j = i+dir;
      if(j<0 || j>=cols.length) return cols;
      const copy = cols.slice();
      const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
      return copy;
    });
  }
  function toggleColumn(name){
    setSelectedColumns(cols => cols.includes(name) ? cols.filter(c=>c!==name) : [...cols, name]);
  }

  function cleanOutputName(name, fallback, index, splitFile=false){
    const trimmed = String(name || '').trim();
    let withBase = trimmed || fallback;
    if(splitFile){
      if(withBase.toLowerCase().endsWith('.csv')) withBase = withBase.slice(0,-4);
      const trailingNumber = withBase.match(/^(.*?)(?:_|-)(\d+)$/);
      if(trailingNumber){
        const separator = withBase.includes('_'+trailingNumber[2]) ? '_' : '-';
        withBase = trailingNumber[1] + separator + (Number(trailingNumber[2])+index);
      }else{
        withBase = withBase + '_' + (index+1);
      }
    }
    return (withBase.toLowerCase().endsWith('.csv') ? withBase : withBase + '.csv').replace(/[\\/:*?"<>|]/g, '-');
  }

  function setOutputName(index, value){
    setOutputNames(names => {
      const next = names.slice();
      next[index] = value;
      return next;
    });
  }

  function _baseFilenamePreview(base, mode, count){
    let name = String(base || '').trim();
    if(!name) name = mode==='merge' ? 'merged_leads' : 'unique_mobiles';
    if(name.toLowerCase().endsWith('.csv')) name = name.slice(0,-4);
    name = name.replace(/[\\/:*?"<>|]/g,'-');
    const names = [];
    const trailingNumber = name.match(/^(.*?)(?:_|-)(\d+)$/);
    for(let i=0;i<count;i++){
      if(trailingNumber){
        const separator = name.includes('_'+trailingNumber[2]) ? '_' : '-';
        names.push(trailingNumber[1]+separator+(Number(trailingNumber[2])+i)+'.csv');
      }else{
        names.push(name+'_'+(i+1)+'.csv');
      }
    }
    return names.join(', ');
  }

  async function runProcess(){
    setResult(null);
    setProc({running:true, pct:2, phase:'Preparing…', scanned:0, total:totalRowsParsed||1});
    pushLog('Starting…', 'ok');
    await new Promise(r=>setTimeout(r,0));

    let lookupMap = null;
    if(mobileMode === 'lookup'){
      lookupMap = new Map();
      lookupTables.forEach(t=>{
        const keyIdx = t.header.indexOf(lookupKey);
        const valIdx = t.header.indexOf(lookupValue);
        if(keyIdx<0 || valIdx<0) return;
        const rows = lookupRowsRef.current.get(t.id) || [];
        rows.forEach(r=>{
          const k = U.keyText(r[keyIdx]);
          if(!k) return;
          if(!lookupMap.has(k)) lookupMap.set(k, r[valIdx]);
        });
        lookupRowsRef.current.delete(t.id); // folded into lookupMap — free the raw rows now
      });
      pushLog('Lookup map built: ' + fmtNum(lookupMap.size) + ' keys', 'ok');
    }

    let resolvedMobileColumns = mobileColumns.filter(name => includedTables.some(t => t.header.indexOf(name) >= 0));
    if(mobileMode === 'direct' && resolvedMobileColumns.length){
      let selectedCount = 0;
      for(const table of includedTables){
        const idxs = resolvedMobileColumns.map(name=>table.header.indexOf(name)).filter(i=>i>=0);
        if(!idxs.length) continue;
        const rows = rowsRef.current.get(table.id)||[];
        for(const row of rows){ for(const idx of idxs){ if(U.normalizeMobile(row[idx])) selectedCount++; } }
      }
      if(selectedCount === 0) resolvedMobileColumns = [];
    }
    if(mobileMode === 'direct' && !resolvedMobileColumns.length){
      let bestName = '';
      let bestCount = -1;
      for(const table of includedTables){
        table.header.forEach((name,idx)=>{
          let count = 0;
          const rows = rowsRef.current.get(table.id)||[];
          for(const row of rows){ if(U.normalizeMobile(row[idx])) count++; }
          if(count>bestCount){bestCount=count;bestName=name;}
        });
      }
      if(bestName){ resolvedMobileColumns = [bestName]; setMobileColumns([bestName]); }
    }

    // Extra columns the user wants kept alongside Mobile in "Unique numbers
    // only" mode (e.g. PAN), each deduped on its own — a row is kept only
    // if its Mobile number AND every one of these extra values are each
    // new (not seen in any row kept so far for that same column).
    const extraCols = mode === 'unique' ? extraUniqueColumns.filter(name => !resolvedMobileColumns.includes(name)) : [];
    const extraColSeen = extraCols.map(()=> new Set());

    const uniqueOrder = []; const uniqueSeen = new Set();
    let scanned = 0, totalMobile = 0, unmatchedLookup = 0, invalidMobile = 0;
    const total = includedTables.reduce((a,t)=>a+t.rowCount,0) || 1;
    const BATCH = 3000;

    // Merge mode streams rows straight into the CURRENT output part's CSV
    // chunks instead of collecting every row into one giant array first and
    // splitting it afterwards — on a 450MB input that difference is holding
    // the data twice versus once. Merge mode keeps every scanned row (no
    // filtering), so the final row count always equals `total`, which lets
    // the part boundaries be fixed before the scan even starts.
    const mergeHeader = selectedColumns;
    let mergePerFile = Infinity, mergeTotalParts = 1;
    if(mode === 'merge' && splitMode !== 'none'){
      mergePerFile = splitMode === 'rows' ? Math.max(1, splitValue) : U.rowsPerPart(total, Math.max(1, splitValue));
      mergeTotalParts = Math.max(1, Math.ceil(total / mergePerFile));
    }
    const mergeOutputs = [];
    let curChunks = mode === 'merge' ? [mergeHeader.map(csvEscape).join(',') + '\r\n'] : null;
    let curRowCount = 0, curPartIdx = 0;
    function flushMergePart(){
      const name = mergeTotalParts > 1 ? ('merged_leads_part'+(curPartIdx+1)+'.csv') : 'merged_leads.csv';
      const blob = new Blob(curChunks, {type:'text/csv'});
      mergeOutputs.push({name, size: blob.size, rowCount: curRowCount, blob, saved:false});
      curPartIdx++;
      curChunks = [mergeHeader.map(csvEscape).join(',') + '\r\n'];
      curRowCount = 0;
    }

    for(const t of includedTables){
      const rows = rowsRef.current.get(t.id) || [];
      const mobileIdxs = mobileMode === 'direct' ? resolvedMobileColumns.map(name=>t.header.indexOf(name)).filter(i=>i>=0) : [];
      const mainKeyIdx = mobileMode === 'lookup' ? t.header.indexOf(lookupMainKey) : -1;
      const colIdx = mode === 'merge' ? selectedColumns.map(c => t.header.indexOf(c)) : null;
      const extraColIdx = extraCols.map(name => t.header.indexOf(name));

      for(let i=0;i<rows.length;i+=BATCH){
        const slice = rows.slice(i, i+BATCH);
        for(const r of slice){
          // In "direct" mode a row can have more than one selected mobile
          // column (e.g. "Mobile" and "Alternate Mobile"); every valid
          // number found across all of them counts and is deduped together.
          let mobileRaws;
          if(mobileMode === 'direct'){
            mobileRaws = mobileIdxs.map(ix => r[ix]);
          } else {
            const k = mainKeyIdx>=0 ? U.keyText(r[mainKeyIdx]) : '';
            const raw = (k && lookupMap.has(k)) ? lookupMap.get(k) : null;
            if(!raw) unmatchedLookup++;
            mobileRaws = [raw];
          }

          for(const mobileRaw of mobileRaws){
            const clean = U.normalizeMobile(mobileRaw);
            if(clean) totalMobile++;
            if(!clean && mobileRaw!==null && mobileRaw!==undefined) invalidMobile++;
          }

          if(mode === 'unique'){
            if(extraColIdx.length === 0){
              // No extra columns selected — unchanged behavior: pool every
              // valid hit from every selected mobile-ish column.
              for(const mobileRaw of mobileRaws){
                const clean = U.normalizeMobile(mobileRaw);
                if(clean && !uniqueSeen.has(clean)){ uniqueSeen.add(clean); uniqueOrder.push(clean); }
              }
            } else {
              // Extra columns selected (e.g. PAN alongside Mobile): take the
              // first valid mobile number in this row, pair it with this
              // row's extra values, and keep the row only if the mobile AND
              // every non-blank extra value are each new to their own column.
              let clean = null;
              for(const mobileRaw of mobileRaws){ clean = U.normalizeMobile(mobileRaw); if(clean) break; }
              if(clean && !uniqueSeen.has(clean)){
                const extraVals = extraColIdx.map(ix => ix>=0 ? String(r[ix]==null?'':r[ix]).trim() : '');
                const dup = extraVals.some((v,i) => v && extraColSeen[i].has(v.toLowerCase()));
                if(!dup){
                  uniqueSeen.add(clean);
                  extraVals.forEach((v,i)=>{ if(v) extraColSeen[i].add(v.toLowerCase()); });
                  uniqueOrder.push([clean, ...extraVals]);
                }
              }
            }
          }

          if(mode === 'merge'){
            const out = colIdx.map(ix => ix>=0 ? r[ix] : '');
            curChunks.push(out.map(csvEscape).join(',') + '\r\n');
            curRowCount++;
            if(curRowCount >= mergePerFile) flushMergePart();
          }
        }
        scanned += slice.length;
        const pct = 5 + Math.round((scanned/total)*85);
        setProc(p=>({...p, pct: Math.min(pct,92), phase:'Scanning ' + t.label + '…', scanned, total}));
        await new Promise(r=>setTimeout(r,0));
      }
      rowsRef.current.delete(t.id); // this table is fully scanned — free it before the next one loads
    }

    pushLog('Scanned ' + fmtNum(scanned) + ' rows', 'ok');
    setProc(p=>({...p, pct:94, phase:'Building output…'}));
    await new Promise(r=>setTimeout(r,0));

    let outputs;
    if(mode === 'merge'){
      if(curRowCount > 0 || mergeOutputs.length === 0) flushMergePart();
      outputs = mergeOutputs.map((out, idx) => {
        const fallback = mergeOutputs.length > 1 ? ('merged_leads_part'+(idx+1)+'.csv') : 'merged_leads.csv';
        return {...out, name:cleanOutputName(outputNames[0], fallback, idx, mergeOutputs.length > 1)};
      });
    } else {
      // With extra columns selected, each row in uniqueOrder is an array
      // [mobile, ...extraValues] and the header always starts with the
      // fixed label "Mobile" followed by each extra column's own name, in
      // the order it was selected. With none selected, this is unchanged:
      // a single "mobile" column of plain numbers.
      const header = extraCols.length ? ['Mobile', ...extraCols] : ['mobile'];
      let parts;
      if(splitMode === 'none'){
        parts = [uniqueOrder];
      } else {
        const perFile = splitMode === 'rows' ? Math.max(1, splitValue) : U.rowsPerPart(uniqueOrder.length, Math.max(1, splitValue));
        parts = [];
        for(let i=0;i<uniqueOrder.length;i+=perFile) parts.push(uniqueOrder.slice(i, i+perFile));
        if(parts.length === 0) parts = [[]];
      }
      outputs = parts.map((p, idx) => {
        const chunks = [header.map(csvEscape).join(',') + '\r\n'];
        p.forEach(n => chunks.push((Array.isArray(n) ? n.map(csvEscape).join(',') : csvEscape(n)) + '\r\n'));
        const blob = new Blob(chunks, {type:'text/csv'});
        const fallback = parts.length>1 ? ('unique_mobiles_part'+(idx+1)+'.csv') : 'unique_mobiles.csv';
        const name = cleanOutputName(outputNames[0], fallback, idx, parts.length > 1);
        return {name, size:blob.size, rowCount:p.length, blob, saved:false};
      });
    }

    setProc({running:false, pct:100, phase:'Done', scanned, total});
    setResult({
      totalRows: scanned,
      totalMobile,
      uniqueCount: mode==='unique' ? uniqueOrder.length : scanned,
      invalidMobile,
      unmatchedLookup: mobileMode==='lookup' ? unmatchedLookup : null,
      outputs,
    });
    setCustomFileNames({});
    setEditingOutputIdx(null);
    pushLog('Done — ' + outputs.length + ' file(s) ready', 'ok');
  }

  function markSaved(idx){
    setResult(r=>{
      const outputs = r.outputs.slice();
      outputs[idx] = {...outputs[idx], saved:true};
      return {...r, outputs};
    });
  }

  async function downloadAllZip(){
    if(!result || zipping) return;
    if(typeof JSZip === 'undefined'){
      pushLog('ZIP download unavailable — refresh and try again', 'err');
      return;
    }

    setZipping(true);
    try{
      const zip = new JSZip();
      result.outputs.forEach((out, idx) => zip.file(effectiveOutputName(idx), out.blob));
      const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
      let zipBase = String(outputNames[0] || '').trim();
      if(!zipBase) zipBase = mode==='merge' ? 'merged_leads' : 'unique_mobiles';
      zipBase = zipBase.replace(/\.csv$/i,'').replace(/[\\/:*?"<>|]/g,'-');
      zipBase = zipBase.replace(/(?:_|-)(\d+)$/, '');
      const zipName = zipBase + '.zip';

      if(downloadsCap){
        await downloadsCap.save({filename:zipName, data:blob});
      }else if(!inArtifactHost){
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = zipName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
      }else{
        pushLog('ZIP download unavailable in this preview', 'err');
        return;
      }
      pushLog('Downloaded ' + result.outputs.length + ' file(s) as ZIP', 'ok');
    }catch(e){
      pushLog('Could not create ZIP: ' + (e.message || e), 'err');
    }finally{
      setZipping(false);
    }
  }

  async function downloadFileNameList(){
    if(!result || typeof XLSX === 'undefined'){
      pushLog('Excel download unavailable — refresh and try again', 'err');
      return;
    }

    try{
      const rows = [['File Name']];
      result.outputs.forEach((out, idx)=>{
        const name = effectiveOutputName(idx).replace(/\.csv$/i,'');
        rows.push([name]);
      });

      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      worksheet['!cols'] = [{wch:50}];
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'File Names');
      const wbout = XLSX.write(workbook, {bookType:'xlsx', type:'array'});
      const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

      // Name the downloaded XLSX after the user's own output filename base
      // (e.g. "Leads_221126"), stripped of any trailing "_1"/"_2" part
      // number — the sheet inside already lists every part by its own name.
      let stem = String(outputNames[0] || '').trim();
      if(!stem) stem = mode==='merge' ? 'merged_leads' : 'unique_mobiles';
      if(stem.toLowerCase().endsWith('.csv')) stem = stem.slice(0,-4);
      stem = stem.replace(/[\\/:*?"<>|]/g,'-');
      const trailingNumber = stem.match(/^(.*?)(?:_|-)(\d+)$/);
      if(trailingNumber) stem = trailingNumber[1];
      const xlsxName = stem + '.xlsx';

      if(downloadsCap){
        await downloadsCap.save({filename:xlsxName, data:blob});
      }else if(!inArtifactHost){
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = xlsxName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url),4000);
      }else{
        pushLog('Excel download unavailable in this preview', 'err');
        return;
      }
      pushLog('Downloaded output filename list', 'ok');
    }catch(e){
      pushLog('Could not create filename XLSX: ' + (e.message || e), 'err');
    }
  }

  function resetGeneratedOutput(){
    setResult(null);
    setProc({running:false, pct:0, phase:'', scanned:0, total:0});
    setSplitMode('none');
    setSplitValue('');
    setOutputNames([]);
    setCustomFileNames({});
    setEditingOutputIdx(null);
    pushLog('Reset output — choose settings and process again', 'ok');
  }

  // Returns the name a given output file will actually download as — the
  // user's edited name if they renamed it via the pencil icon, else the
  // auto-generated name.
  function effectiveOutputName(idx){
    const out = result.outputs[idx];
    return customFileNames[idx] || out.name;
  }

  function renameOutput(idx, rawBase){
    const base = String(rawBase).replace(/[\\/:*?"<>|]/g,'-').trim();
    setCustomFileNames(prev=>{
      const next = {...prev};
      if(base) next[idx] = base + '.csv';
      else delete next[idx];
      return next;
    });
  }

  async function saveOutput(idx){
    const out = result.outputs[idx];
    const name = effectiveOutputName(idx);
    if(downloadsCap){
      try{
        await downloadsCap.save({filename: name, data: out.blob});
        markSaved(idx);
      }catch(e){
        pushLog('Save cancelled: ' + name, 'err');
      }
      return;
    }
    if(!inArtifactHost){
      // A normal website (e.g. this same code deployed on Cloudflare Pages) —
      // a plain browser download, exactly like any other site.
      const url = URL.createObjectURL(out.blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      markSaved(idx);
      return;
    }
    const text = await out.blob.text();
    try{
      await navigator.clipboard.writeText(text);
      pushLog('Copied ' + name + ' to clipboard (downloads unavailable here)', 'ok');
    }catch(e){
      pushLog('Clipboard unavailable — open this page outside the preview to download.', 'err');
    }
  }

  useEffect(()=>{
    if(lockSeconds <= 0) return;
    const timer = setInterval(()=>{
      const remaining = Math.max(0, Math.ceil((lockUntil-Date.now())/1000));
      setLockSeconds(remaining);
      if(remaining <= 0){
        clearInterval(timer);
        setFailedAttempts(0);
        setLockUntil(0);
        sessionStorage.removeItem('leadclean_failed_attempts');
        sessionStorage.removeItem('leadclean_lock_until');
        setLoginError('');
      }
    },250);
    return ()=>clearInterval(timer);
  }, [lockUntil, lockSeconds]);

  async function handleLogin(e){
    e.preventDefault();
    if(Date.now() < lockUntil){
      setLoginError('Try again ' + Math.ceil((lockUntil-Date.now())/1000) + ' seconds later.');
      return;
    }
    setLoginBusy(true);
    let ok = false;
    let token = '';
    try{
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ mobile: loginMobile, password: loginPassword })
      });
      const data = await res.json().catch(()=>({}));
      ok = res.ok && data && data.ok === true;
      token = (data && data.token) || '';
    }catch(e){
      setLoginBusy(false);
      setLoginError('Could not reach the server. Check your connection and try again.');
      return;
    }
    setLoginBusy(false);
    if(ok){
      sessionStorage.setItem('leadclean_authenticated','true');
      sessionStorage.setItem('leadclean_token', token);
      if(rememberMe){
        localStorage.setItem('leadclean_authenticated','true');
        localStorage.setItem('leadclean_remember_me','true');
        localStorage.setItem('leadclean_token', token);
      }else{
        localStorage.removeItem('leadclean_authenticated');
        localStorage.removeItem('leadclean_remember_me');
        localStorage.removeItem('leadclean_token');
      }
      sessionStorage.removeItem('leadclean_failed_attempts');
      sessionStorage.removeItem('leadclean_lock_until');
      setAuthenticated(true);
      setLoginError('');
    }else{
      const attempts = failedAttempts + 1;
      setFailedAttempts(attempts);
      sessionStorage.setItem('leadclean_failed_attempts', String(attempts));
      if(attempts >= 3){
        const until = Date.now()+30000;
        setLockUntil(until);
        setLockSeconds(30);
        sessionStorage.setItem('leadclean_lock_until', String(until));
        setLoginError('Try again 30 seconds later.');
      }else{
        setLoginError('Invalid mobile number or password. ' + (3-attempts) + ' attempt(s) remaining.');
      }
    }
  }

  function openForgotPassword(){
    setForgotOpen(true);
    setForgotStep('email');
    setForgotEmail('');
    setForgotCode('');
    setForgotNewPassword('');
    setForgotConfirmPassword('');
    setForgotError('');
    setResetToken('');
  }

  function closeForgotPassword(){
    setForgotOpen(false);
  }

  async function submitForgotEmail(e){
    e.preventDefault();
    setForgotError('');
    setForgotBusy(true);
    try{
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: forgotEmail.trim() })
      });
      await res.json().catch(()=>({}));
      // Same response shown whether or not the email matched — the backend
      // itself never reveals which, so there's nothing more to branch on here.
      setForgotStep('otp');
    }catch(e){
      setForgotError('Could not reach the server. Check your connection and try again.');
    }finally{
      setForgotBusy(false);
    }
  }

  async function submitForgotOtp(e){
    e.preventDefault();
    setForgotError('');
    setForgotBusy(true);
    try{
      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: forgotEmail.trim(), code: forgotCode.trim() })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data && data.resetToken){
        setResetToken(data.resetToken);
        setForgotStep('reset');
      }else{
        setForgotError((data && data.error) || 'That code is incorrect or has expired.');
      }
    }catch(e){
      setForgotError('Could not reach the server. Check your connection and try again.');
    }finally{
      setForgotBusy(false);
    }
  }

  async function submitForgotReset(e){
    e.preventDefault();
    setForgotError('');
    if(forgotNewPassword.length < 8){
      setForgotError('Password must be at least 8 characters.');
      return;
    }
    if(forgotNewPassword !== forgotConfirmPassword){
      setForgotError('Passwords do not match.');
      return;
    }
    setForgotBusy(true);
    try{
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ resetToken, newPassword: forgotNewPassword })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data && data.ok){
        setForgotStep('done');
      }else{
        setForgotError((data && data.error) || 'Could not update the password. Start again.');
      }
    }catch(e){
      setForgotError('Could not reach the server. Check your connection and try again.');
    }finally{
      setForgotBusy(false);
    }
  }

  if(!authenticated){
    return (
      <main className={'login-page lamp-mode' + (lampOn ? ' lamp-on' : '')}>
        <div className="lamp-ambient"></div>
        <div className="lamp-wrap">
          <div className="lamp-light-cone"></div>
          <div className="lamp-shade">
            <div className="lamp-shade-top"></div>
            <div className="lamp-face">
              <div className="lamp-eyes">
                <div className="lamp-eye"></div>
                <div className="lamp-eye"></div>
              </div>
              <div className="lamp-mouth"></div>
              <div className="lamp-tongue"></div>
            </div>
          </div>
          <div className="lamp-pole"></div>
          <div className="lamp-base"></div>
          <button
            type="button"
            className={'lamp-cord' + (cordPulsing ? ' lamp-pulled' : '')}
            onClick={pullCord}
            aria-label="Pull the cord to show or hide sign-in"
            title="Pull me"
          >
            <span className="lamp-cord-bead"></span>
          </button>
          <div className="lamp-hint">{lampOn ? 'pull again to turn off' : 'pull the cord to sign in'}</div>
        </div>

        <div className={'login-card lamp-mode' + (lampOn ? ' is-on' : '')}>
          <Brand wordmark={true} login={true} />
          <div className="welcome-eyebrow">Welcome back</div>
          <h1>Sign in</h1>
          <p>Enter your credentials to open LeadClean.</p>
          <form onSubmit={handleLogin}>
            <div className="field">
              <label htmlFor="login-mobile">Mobile number</label>
              <input id="login-mobile" className="text-input" type="tel" inputMode="numeric" placeholder="98XXXXXXXX" value={loginMobile} onChange={e=>setLoginMobile(e.target.value)} autoComplete="username" required />
            </div>
            <div className="field">
              <label htmlFor="login-password">Password</label>
              <input id="login-password" className="text-input" type="password" value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} autoComplete="current-password" required />
            </div>
            <div className="login-options">
              <label className="remember-option">
                <input type="checkbox" checked={rememberMe} onChange={e=>setRememberMe(e.target.checked)} />
                <span>Remember me</span>
              </label>
              <button type="button" className="forgot-link" onClick={openForgotPassword}>Forgot password?</button>
            </div>
            {loginError && <p className="login-error">{lockSeconds > 0 ? 'Try again ' + lockSeconds + ' seconds later.' : loginError}</p>}
            <button className="cta-btn" type="submit" disabled={lockSeconds > 0 || loginBusy}>{lockSeconds > 0 ? 'Try again in ' + lockSeconds + 's' : (loginBusy ? 'Signing in…' : 'Sign in')}</button>
            <p className="login-privacy">Everything runs in this browser tab. No file is uploaded anywhere.</p>
          </form>
        </div>

        {forgotOpen && (
          <div className="forgot-overlay" role="dialog" aria-modal="true">
            <div className="forgot-card">
              <button type="button" className="forgot-close" onClick={closeForgotPassword} aria-label="Close">×</button>

              {forgotStep === 'email' && (
                <form onSubmit={submitForgotEmail}>
                  <h2>Reset password</h2>
                  <p>Enter the admin email. If it matches our records, we'll send a 6-digit code to it.</p>
                  <div className="field">
                    <label htmlFor="forgot-email">Email</label>
                    <input id="forgot-email" className="text-input" type="email" placeholder="you@example.com" value={forgotEmail} onChange={e=>setForgotEmail(e.target.value)} autoComplete="email" required />
                  </div>
                  {forgotError && <p className="login-error">{forgotError}</p>}
                  <button className="cta-btn" type="submit" disabled={forgotBusy}>{forgotBusy ? 'Sending…' : 'Send code'}</button>
                </form>
              )}

              {forgotStep === 'otp' && (
                <form onSubmit={submitForgotOtp}>
                  <h2>Enter the code</h2>
                  <p>If {forgotEmail} is the registered admin email, a 6-digit code was just sent to it. It expires in 10 minutes.</p>
                  <div className="field">
                    <label htmlFor="forgot-code">6-digit code</label>
                    <input id="forgot-code" className="text-input" type="text" inputMode="numeric" maxLength="6" placeholder="123456" value={forgotCode} onChange={e=>setForgotCode(e.target.value.replace(/\D/g,''))} autoComplete="one-time-code" required />
                  </div>
                  {forgotError && <p className="login-error">{forgotError}</p>}
                  <button className="cta-btn" type="submit" disabled={forgotBusy}>{forgotBusy ? 'Verifying…' : 'Verify code'}</button>
                  <button type="button" className="forgot-link" onClick={()=>setForgotStep('email')}>Use a different email</button>
                </form>
              )}

              {forgotStep === 'reset' && (
                <form onSubmit={submitForgotReset}>
                  <h2>Set a new password</h2>
                  <p>Choose a new password (at least 8 characters).</p>
                  <div className="field">
                    <label htmlFor="forgot-new-password">New password</label>
                    <input id="forgot-new-password" className="text-input" type="password" value={forgotNewPassword} onChange={e=>setForgotNewPassword(e.target.value)} autoComplete="new-password" required />
                  </div>
                  <div className="field">
                    <label htmlFor="forgot-confirm-password">Confirm new password</label>
                    <input id="forgot-confirm-password" className="text-input" type="password" value={forgotConfirmPassword} onChange={e=>setForgotConfirmPassword(e.target.value)} autoComplete="new-password" required />
                  </div>
                  {forgotError && <p className="login-error">{forgotError}</p>}
                  <button className="cta-btn" type="submit" disabled={forgotBusy}>{forgotBusy ? 'Saving…' : 'Update password'}</button>
                </form>
              )}

              {forgotStep === 'done' && (
                <div>
                  <h2>Password updated</h2>
                  <p>Your password has been changed. You can sign in now with your new password.</p>
                  <button className="cta-btn" type="button" onClick={closeForgotPassword}>Back to sign in</button>
                </div>
              )}
            </div>
          </div>
        )}
      </main>
    );
  }

  return (
    <div>
      <div className="nav-row">
        <nav className="nav">
          <Brand wordmark={true} />
          <div className="nav-links">
            <a className="nav-link" href="#how">How it works</a>
            <a className="nav-link" href="#privacy">Privacy</a>
          </div>
          <div className="nav-actions">
            <button className="theme-toggle-btn" onClick={toggleTheme} title={theme==='dark' ? 'Switch to light mode' : 'Switch to dark mode'} aria-label="Toggle dark mode">
              {theme==='dark' ? '☀️' : '🌙'}
            </button>
            <button className="nav-cta" onClick={openTeamPanel}>Manage team</button>
            <button className="nav-cta" onClick={()=>window.location.reload()}>Start over</button>
            <button className="nav-cta" onClick={()=>{sessionStorage.removeItem('leadclean_authenticated'); sessionStorage.removeItem('leadclean_token'); localStorage.removeItem('leadclean_authenticated'); localStorage.removeItem('leadclean_token'); setAuthenticated(false);}}>Sign out</button>
          </div>
        </nav>
      </div>

      {teamOpen && (
        <div className="team-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) closeTeamPanel(); }}>
          <div className="team-card">
            <div className="team-card-head">
              <h2>Manage team</h2>
              <button className="team-close-btn" onClick={closeTeamPanel} aria-label="Close">✕</button>
            </div>
            <p className="team-card-sub">Teammates added here can log in with their own mobile number &amp; password, same access as you.</p>

            {teamError && <div className="team-error">{teamError}</div>}

            <form className="team-add-row" onSubmit={addTeamUser}>
              <input
                type="text"
                className="text-input"
                placeholder="10-digit mobile number"
                value={teamNewMobile}
                onChange={e=>setTeamNewMobile(e.target.value)}
                maxLength={10}
                inputMode="numeric"
              />
              <input
                type="password"
                className="text-input"
                placeholder="Password (min 8 characters)"
                value={teamNewPassword}
                onChange={e=>setTeamNewPassword(e.target.value)}
              />
              <button className="cta-btn" type="submit" disabled={teamAddBusy}>
                {teamAddBusy ? 'Adding…' : 'Add teammate'}
              </button>
            </form>

            <div className="team-list">
              {teamLoading ? (
                <div className="team-list-empty">Loading…</div>
              ) : teamUsers.length === 0 ? (
                <div className="team-list-empty">No team members yet.</div>
              ) : teamUsers.map(u => (
                <div className="team-row" key={u.mobile}>
                  <span className="team-row-mobile">{u.mobile}</span>
                  {u.isAdmin ? (
                    <span className="team-row-badge">Admin</span>
                  ) : (
                    <button className="team-row-remove" onClick={()=>removeTeamUser(u.mobile)}>Remove</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="wrap">
        <div className="hero">
          <span className="eyebrow">Lead file cleanup</span>
          <h1>Merge the files. <em>Keep the numbers.</em></h1>
          <p>Drop in your CSV or Excel lead exports, pick which column holds the mobile number (or join it from another file), and get one clean, de-duplicated list back — split however you need it.</p>
          <span id="privacy" className="privacy-chip"><i></i>Everything runs in this browser tab. No file is uploaded anywhere.</span>
        </div>

        <div className="grid">
          <div className="col-main">

            <section className="panel">
              <div className="panel-head">
                <div>
                  <h2><StepBadge n="1" done={files.length>0} /> Add your files</h2>
                  <p className="panel-sub">CSV, XLS or XLSX — multiple files and multi-sheet workbooks are both fine.</p>
                </div>
              </div>
              <Dropzone onFiles={addFiles} accept=".csv,.txt,.xlsx,.xls" placeholder="CSV, XLS or XLSX, any size." />
              {parsing && <p className="status-line status-warn"><i></i>Reading file(s)…</p>}
              {parseError && <p className="status-line" style={{color:'var(--bad)'}}><i style={{background:'var(--bad)'}}></i>{parseError}</p>}
              {files.map(f=>(
                <div className="file-row" key={f.id}>
                  <span className="file-icon">{f.name.split('.').pop().slice(0,3).toUpperCase()}</span>
                  <div className="file-meta">
                    <div className="name">{f.name}</div>
                    <div className="sub">{fmtBytes(f.size)} · {fmtNum(fileReadRows[f.id] ?? tables.filter(t=>t.fileId===f.id).reduce((sum,t)=>sum+t.rowCount,0))} rows</div>
                    {fileReadProgress[f.id] !== undefined && (
                      <div className="file-progress" data-reading={fileReadProgress[f.id] < 100}>
                        <span>{fileReadProgress[f.id] >= 100 ? ('Read 100% · ' + fmtNum(fileReadRows[f.id] ?? tables.filter(t=>t.fileId===f.id).reduce((sum,t)=>sum+t.rowCount,0)) + ' rows') : (fileReadProgress[f.id] >= 95 ? 'Analyzing file… ' : 'Reading ' + fileReadProgress[f.id] + '%')}</span>
                        <span className="file-progress-bar"><i style={{width:fileReadProgress[f.id]+'%'}}></i></span>
                      </div>
                    )}
                  </div>
                  <button className="file-remove" onClick={()=>removeFile(f.id)}>Remove</button>
                </div>
              ))}
            </section>

            <section className="panel" data-locked={tables.length===0}>
              <div className="panel-head">
                <div>
                  <h2><StepBadge n="2" done={tables.length>0 && problemGroups.length===0} /> Check the columns</h2>
                  <p className="panel-sub">Sheets with the same columns in a different order are grouped as one issue, not repeated per sheet.</p>
                </div>
              </div>
              {tables.length===0 && <p className="panel-sub">Add files above to see this.</p>}
              {tables.length>0 && (
                <div className="field">
                  <label>{unionColumns.length} column(s) found across {tables.length} sheet(s)</label>
                  <div className="column-check-list">
                    {unionColumns.map(c=>{
                      const selected = mobileColumns.includes(c.name);
                      return (
                        <div className="column-check-row" data-selected={selected} key={c.name}>
                          <span className="column-check-name">{c.name}</span>
                          <span className="column-check-count">Present in {c.count}/{tables.length} sheets</span>
                          <button
                            type="button"
                            className="column-check-select"
                            onClick={()=>{
                              setMobileMode('direct');
                              setMobileColumns(cols => cols.includes(c.name) ? cols.filter(n=>n!==c.name) : [...cols, c.name]);
                            }}
                          >
                            {selected ? 'Selected' : 'Select'}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              {tables.length>0 && problemGroups.length===0 && (
                <p className="status-line status-good"><i></i>All {tables.length} sheet(s) share the same {unionColumns.length} columns.</p>
              )}
              {tables.length>0 && problemGroups.length>0 && (
                <>
                  <p className="status-line status-warn"><i></i>{tables.length - problemGroups.reduce((a,g)=>a+g.labels.length,0)} of {tables.length} sheet(s) match; {problemGroups.reduce((a,g)=>a+g.labels.length,0)} don't.</p>
                  {problemGroups.map((g,i)=>{
                    const shape = U.headerShape(g.header);
                    const included = !!skippedShapes[shape];
                    return (
                      <div className="problem-card" key={i}>
                        <h3>{g.labels.length} sheet(s) with different columns</h3>
                        <div className="cols">{g.header.join(', ')}</div>
                        <div className="sheets">Affects: {g.labels.join(', ')}</div>
                        <label>
                          <input type="checkbox" checked={included} onChange={e=>setSkippedShapes(s=>({...s,[shape]:e.target.checked}))} />

                      </div>
                    );
                  })}
                </>
              )}
